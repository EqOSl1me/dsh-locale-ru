name: Upstream drift

# DeepSeek Harness is a developer preview: locales change between releases.
# Extract the corpus from upstream weekly and report what moved, so coverage
# never silently degrades.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone upstream harness
        run: git clone --depth 1 https://github.com/deepseek-ai/deepseek-harness.git "$RUNNER_TEMP/harness"

      - name: Re-extract the corpus
        run: node scripts/extract.mjs --root "$RUNNER_TEMP/harness" --out "$RUNNER_TEMP/corpus"

      - name: Compare namespaces and keys
        id: compare
        run: |
          node -e "
            const fs = require('fs');
            const a = JSON.parse(fs.readFileSync('upstream/corpus.json', 'utf8'));
            const b = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/corpus/corpus.json', 'utf8'));
            const lines = [];
            const flat = (o) => { const s = new Set(); for (const [ns, d] of Object.entries(o)) for (const k of Object.keys(d)) s.add(ns + '::' + k); return s };
            const A = flat(a), B = flat(b);
            for (const ns of Object.keys(b)) if (!(ns in a)) lines.push('new namespace: ' + ns + ' (' + Object.keys(b[ns]).length + ' keys)');
            for (const ns of Object.keys(a)) if (!(ns in b)) lines.push('removed namespace: ' + ns);
            for (const k of B) if (!A.has(k)) lines.push('new key: ' + k);
            for (const k of A) if (!B.has(k)) lines.push('removed key: ' + k);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/drift.txt', lines.join('\n'));
            console.log(lines.length ? lines.join('\n') : 'no upstream drift');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'changed=' + (lines.length ? 'yes' : 'no') + '\n');
          "

      - name: Report drift as an issue
        if: steps.compare.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh issue list --search 'Upstream locale drift in:title' --state open --json number --jq '.[0].number')" ]; then
            echo "an open drift issue already exists; refreshing it"
            NUM=$(gh issue list --search 'Upstream locale drift in:title' --state open --json number --jq '.[0].number')
            gh issue comment "$NUM" --body-file "$RUNNER_TEMP/drift.txt"
          else
            gh issue create --title "Upstream locale drift detected" \
              --body-file "$RUNNER_TEMP/drift.txt" \
              --label dependencies || gh issue create --title "Upstream locale drift detected" --body-file "$RUNNER_TEMP/drift.txt"
          fi
